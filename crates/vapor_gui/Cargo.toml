vapor_installer_ui = { path = "../../../Vapor-Installer/crates/vapor_installer_ui" }
vapor_ide_ui = { path = "../vapor_ide_ui" }
vapor_studio_ui = { path = "../../../Vapor-Studio/crates/vapor_studio_ui" }

