[package]
name = "vapor_gui"
version.workspace = true
edition.workspace = true
[[bin]]
name = "vapor-gui"
path = "src/main.rs"

[[bin]]
name = "vapor-launcher"
path = "src/launcher.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
